name: Build iOS app (unsigned)
on:
  workflow_dispatch:
  push:
    branches: [mobile-app]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-ios.yml'
jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Generate iOS platform project
        run: flutter create --org com.novavisuals --project-name nova_play . --platforms ios
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - name: Upload unsigned iOS build
        uses: actions/upload-artifact@v4
        with:
          name: nova-play-ios-unsigned
          path: mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 7
