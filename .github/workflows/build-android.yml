name: Build Android APK and App Bundle

on:
  workflow_dispatch:
  push:
    branches: [mobile-app]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform project
        run: flutter create --org com.novavisuals --project-name nova_play . --platforms android

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run widget tests
        run: flutter test --reporter expanded

      - name: Configure Google Play upload-key signing and Android 16 target
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name. Add all four Android upload-key secrets before creating a Google Play release."
              exit 1
            fi
          done

          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks

          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/upload-keystore.jks
          EOF

          keytool -export -rfc \
            -keystore android/app/upload-keystore.jks \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -file android/upload_certificate.pem

          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle = next((p for p in candidates if p.exists()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file was not generated.")

          text = gradle.read_text()
          is_kts = gradle.suffix == ".kts"

          if is_kts:
              imports = "import java.io.FileInputStream\nimport java.util.Properties\n"
              if "import java.util.Properties" not in text:
                  text = imports + text
              if "val keystoreProperties =" not in text:
                  marker = "android {"
                  if marker not in text:
                      raise SystemExit("Could not locate android block in Gradle Kotlin DSL.")
                  props = """val keystoreProperties = Properties().apply {
              load(FileInputStream(rootProject.file("key.properties")))
          }

          """
                  text = text.replace(marker, props + marker, 1)
              text = re.sub(r"compileSdk\s*=\s*flutter\.compileSdkVersion", "compileSdk = 36", text)
              text = re.sub(r"targetSdk\s*=\s*flutter\.targetSdkVersion", "targetSdk = 36", text)
              signing = '''signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }

          '''
              if 'create("release")' not in text:
                  text = text.replace("    buildTypes {", "    " + signing.replace("\n", "\n    ").rstrip() + "\n    buildTypes {", 1)
              text = re.sub(r"signingConfig\s*=\s*signingConfigs\.getByName\(\"debug\"\)", 'signingConfig = signingConfigs.getByName("release")', text)
              match = re.search(r"buildTypes\s*\{\s*release\s*\{", text)
              if not match:
                  raise SystemExit("Could not locate release build type.")
              release_body = text[match.end():]
              if 'signingConfig = signingConfigs.getByName("release")' not in release_body.split("}", 1)[0]:
                  text = text[:match.end()] + '\n        signingConfig = signingConfigs.getByName("release")' + text[match.end():]
          else:
              props = """def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

          """
              if "def keystoreProperties =" not in text:
                  text = props + text
              text = re.sub(r"compileSdkVersion\s+flutter\.compileSdkVersion", "compileSdkVersion 36", text)
              text = re.sub(r"targetSdkVersion\s+flutter\.targetSdkVersion", "targetSdkVersion 36", text)
              signing = """signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }

          """
              if "signingConfigs {" not in text:
                  text = text.replace("    buildTypes {", "    " + signing.replace("\n", "\n    ").rstrip() + "\n    buildTypes {", 1)
              match = re.search(r"buildTypes\s*\{\s*release\s*\{", text)
              if not match:
                  raise SystemExit("Could not locate release build type.")
              release_body = text[match.end():]
              if "signingConfig signingConfigs.release" not in release_body.split("}", 1)[0]:
                  text = text[:match.end()] + "\n            signingConfig signingConfigs.release" + text[match.end():]

          if not re.search(r"targetSdk\s*=\s*36|targetSdkVersion\s+36", text):
              raise SystemExit("Could not enforce targetSdk 36.")
          gradle.write_text(text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if not manifest.exists():
              raise SystemExit("AndroidManifest.xml was not generated.")
          manifest_text = manifest.read_text()
          manifest_text, count = re.subn(r'android:label="[^"]+"', 'android:label="NOVA PLAY"', manifest_text, count=1)
          if count != 1:
              raise SystemExit("Could not set the Android launcher label.")
          manifest.write_text(manifest_text)

          print(f"Configured {gradle} for targetSdk 36, upload-key signing, and NOVA PLAY launcher label.")
          PY

      - name: Build signed release APK
        run: flutter build apk --release

      - name: Build signed Google Play App Bundle
        run: flutter build appbundle --release

      - name: Verify Android signatures and target API
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify -verbose -certs "$AAB" >/tmp/aab-signature-check.txt
          grep -q "jar verified" /tmp/aab-signature-check.txt
          APKANALYZER="$(find "$ANDROID_HOME/cmdline-tools" "$ANDROID_HOME/tools" -type f -name apkanalyzer 2>/dev/null | head -n 1 || true)"
          if [[ -n "$APKANALYZER" ]]; then
            TARGET="$("$APKANALYZER" manifest target-sdk "$APK")"
            echo "APK target SDK: $TARGET"
            test "$TARGET" -ge 36
          fi

      - name: Remove private signing material
        if: always()
        run: |
          rm -f android/app/upload-keystore.jks android/key.properties

      - name: Upload Google Play release files
        uses: actions/upload-artifact@v4
        with:
          name: nova-play-google-play-release
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
            mobile/android/upload_certificate.pem
          if-no-files-found: error
          retention-days: 14
