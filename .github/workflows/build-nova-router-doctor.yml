name: Build NOVA Router Doctor APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/nova-router-doctor/**'
      - '.github/workflows/build-nova-router-doctor.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: tools/nova-router-doctor
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nova-router-doctor-debug-apk
          path: tools/nova-router-doctor/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
